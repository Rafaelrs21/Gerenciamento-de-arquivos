services:
    app:
        image: rafaelreis0/file_flow:latest
        container_name: file-flow-app-container
        networks:
            - file-flow-network
        ports:
            - "8080:8080"
        environment:
            SPRING_PROFILES_ACTIVE: k8s
            ENVIRONMENT: k8s
            DB_HOST: database
            POSTGRES_PORT: 5432
            POSTGRES_DB: file_flow
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: admin
            FILE_FLOW_JWT_SECRET: 12345678
            REDIS_HOST: redis
            REDIS_PORT: 6379

            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

            INTEGRATIONS_SES_AWS_REGION: us-east-1
            INTEGRATIONS_SES_SENDER_EMAIL: ${SENDER_EMAIL}
            INTEGRATIONS_SES_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
            INTEGRATIONS_SES_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}

networks:
    file-flow-network:
        external: true