version: '3'
services:
  database:
    image: postgres
    container_name: file-flow-database-container
    restart: always
    networks:
      - file-flow-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: file_flow

  redis:
      image: redis:latest
      restart: always
      networks:
          - file-flow-network
      ports:
        - '6379:6379'

networks:
    file-flow-network:
        external: true