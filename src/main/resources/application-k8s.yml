environment: "k8s"
spring:
    config:
        activate:
            on-profile: k8s
    application:
        name: "Fileflow"
        security:
            token:
                secret: ${FILE_FLOW_JWT_SECRET:12345678}
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:file_flow}
        username: ${POSTGRES_USER:postgres}
        password: ${POSTGRES_PASSWORD:admin}
    jpa:
        properties:
            hibernate:
                show_sql: true
                format_sql: true
                ddl-auto: none
                dialect: org.hibernate.dialect.PostgreSQLDialect
integrations:
    ses:
        aws_region: "us-east-1"
        sender_email: "fulano@de.tal.com.br"
        access_key: "111111"
        secret_key: "111111"