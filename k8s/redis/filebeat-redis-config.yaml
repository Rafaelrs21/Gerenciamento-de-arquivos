apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-redis-config
  namespace: file-flow
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: log
      enabled: true
      paths:
        - /var/log/redis/redis.log
      fields:
        component: redis
        service: redis-cache
        log_type: application
      fields_under_root: true
      multiline.pattern: '^\[\d+\]'
      multiline.negate: true
      multiline.match: after

    output.logstash:
      hosts: ["server.file-flow.svc.cluster.local:5044"]

    processors:
    - add_host_metadata:
        when.not.contains.tags: forwarded
    - add_kubernetes_metadata:
        host: "${NODE_NAME}"
        matchers:
        - logs_path:
            logs_path: "/var/log/containers/"
    - drop_fields:
        fields: ["agent", "ecs", "host.architecture", "host.os"]

    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat
      keepfiles: 7
      permissions: 0644 