apiVersion: apps/v1
kind: Deployment
metadata:
    name: fileflow-front-deployment
    namespace: file-flow
spec:
    replicas: 2
    selector:
        matchLabels:
            app: fileflow-front
    template:
        metadata:
            labels:
                app: fileflow-front
        spec:
            automountServiceAccountToken: false
            containers:
                -   name: fileflow-front
                    image: taohansens/fileflow-front-infnet:latest
                    ports:
                    - containerPort: 80
                    imagePullPolicy: Always
                    env:
                    - name: BACKEND_URL
                      value: "http://fileflow-svc:8080" 
            restartPolicy: Always
