apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog
  labels:
    app: graylog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graylog
  template:
    metadata:
      labels:
        app: graylog
    spec:
      hostname: server
      containers:
        - name: graylog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/usr/bin/tini", "--"]
          args: ["/docker-entrypoint.sh"]
          env:
            - name: GRAYLOG_NODE_ID_FILE
              value: "/usr/share/graylog/data/data/node-id"
            - name: GRAYLOG_PASSWORD_SECRET
              value: "thisisaverysecretkey123"
            - name: GRAYLOG_ROOT_PASSWORD_SHA2
              value: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
            - name: GRAYLOG_HTTP_BIND_ADDRESS
              value: "0.0.0.0:9000"
            - name: GRAYLOG_HTTP_EXTERNAL_URI
              value: "http://localhost:30090/"
            - name: GRAYLOG_MONGODB_URI
              value: "mongodb://mongodb:27017/graylog"
          ports:
            - containerPort: 9000
              name: web
          volumeMounts:
            - name: graylog-data
              mountPath: /usr/share/graylog/data/data
      volumes:
        - name: graylog-data
          {{- if .Values.graylog.persistence.enabled }}
          persistentVolumeClaim:
            claimName: graylog-data-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}