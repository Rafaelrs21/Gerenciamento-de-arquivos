apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: file-flow
spec:
  type: {{ .Values.service.type }}
  selector:
    app: graylog
  ports:
    - port: 9000
      targetPort: 9000
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - port: 12201
      targetPort: 12201
      protocol: UDP
      name: gelf-udp
    - port: 12201
      targetPort: 12201
      protocol: TCP
      name: gelf-tcp
    - port: 5044
      targetPort: 5044
      protocol: TCP
      name: beats
    - port: 5140
      targetPort: 5140
      protocol: TCP
      name: syslog-tcp
    - port: 5140
      targetPort: 5140
      protocol: UDP
      name: syslog-udp
    - port: 5555
      targetPort: 5555
      protocol: TCP
      name: raw-tcp