apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres
spec:
    serviceName: "postgres"
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                -   name: postgres
                    image: postgres:latest
                    ports:
                        -   containerPort: 5432
                            name: postgres
                    envFrom:
                        -   configMapRef:
                                name: postgres-config
                    volumeMounts:
                        -   name: postgres-data
                            mountPath: /var/lib/postgresql/data
                            subPath: postgres
    volumeClaimTemplates:
        -   metadata:
                name: postgres-data
            spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                    requests:
                        storage: 10Gi
