apiVersion: apps/v1
kind: Deployment
metadata:
    name: fileflow-deployment
    namespace: file-flow
spec:
    replicas: 1
    selector:
        matchLabels:
            app: fileflow
    template:
        metadata:
            labels:
                app: fileflow
        spec:
            automountServiceAccountToken: false
            containers:
                -   name: fileflow
                    image: rafaelreis0/file_flow:latest
                    imagePullPolicy: Always
                    env:
                        -   name: APP_PROFILE
                            value: "k8s"
                        -   name: DB_HOST
                            value: "postgres-svc"
                        -   name: REDIS_HOST
                            value: "redis-svc"
                    envFrom:
                        -   configMapRef:
                                name: postgres-config
                        -   configMapRef:
                                name: fileflow-config
            restartPolicy: Always
