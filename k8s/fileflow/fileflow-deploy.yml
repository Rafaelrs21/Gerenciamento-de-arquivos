apiVersion: apps/v1
kind: Deployment
metadata:
    name: fileflow-deployment
    namespace: file-flow
spec:
    replicas: 1
    selector:
        matchLabels:
            app: fileflow
    template:
        metadata:
            labels:
                app: fileflow
        spec:
            automountServiceAccountToken: false
            containers:
                -   name: fileflow
                    image: taohansens/fileflow-infnet:latest
                    imagePullPolicy: Always
                    env:
                        -   name: APP_PROFILE
                            value: "k8s"
                        -   name: DB_HOST
                            value: "postgres-svc"
                        -   name: REDIS_HOST
                            value: "redis-svc"
                        -   name: SERVER_PORT
                            value: "8080"
                        # Configurações Graylog
                        -   name: GRAYLOG_HOST
                            value: "server.file-flow.svc.cluster.local"
                        -   name: GRAYLOG_PORT
                            value: "12201"
                        -   name: LOGGING_GELF_ENABLED
                            value: "true"
                        -   name: LOGGING_LEVEL_COM_YOURAPP
                            value: "INFO"
                    envFrom:
                        -   configMapRef:
                                name: postgres-config
                    ports:
                        -   containerPort: 8080
                            name: http
            restartPolicy: Always
